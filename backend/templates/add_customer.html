<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Customer - CableConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .header-text {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Main container */
        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .title {
            margin-bottom: 8px;
            color: #1e293b;
            font-size: 28px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* Two columns */
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #64748b;
            font-size: 14px;
        }

        /* Mobile */
        @media (max-width: 650px) {

            .header {
                padding: 18px 20px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .card {
                padding: 25px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">CableConnect</div>
        <div class="header-text">Operator Management System</div>
    </header>


    <!-- Main -->
    <main class="container">

        <div class="card">

            <h1 class="title">Add Customer</h1>

            <p class="subtitle">
                Enter the customer's connection details below.
            </p>


            <form method="POST">

                <!-- Name + Mobile -->
                <div class="row">

                    <div class="form-group">

                        <label for="name">
                            Customer Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter customer name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="mobile">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            placeholder="Enter mobile number"
                            maxlength="15"
                            required
                        >

                    </div>

                </div>


                <!-- Address -->
                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter customer address"
                        required
                    ></textarea>

                </div>


                <!-- Amount + Date -->
                <div class="row">

                    <div class="form-group">

                        <label for="monthly_amount">
                            Monthly Amount (₹)
                        </label>

                        <input
                            type="number"
                            id="monthly_amount"
                            name="monthly_amount"
                            placeholder="Example: 250"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="connection_start_date">
                            Connection Start Date
                        </label>

                        <input
                            type="date"
                            id="connection_start_date"
                            name="connection_start_date"
                            required
                        >

                    </div>

                </div>


                <!-- STB Number -->
                <div class="form-group">

                    <label for="stb_number">
                        STB Number
                    </label>

                    <input
                        type="text"
                        id="stb_number"
                        name="stb_number"
                        placeholder="Enter STB number"
                        required
                    >

                </div>


                <!-- Buttons -->
                <div class="buttons">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Add Customer
                    </button>

                    <a
                        href="/customers"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>


        <div class="footer">
            © 2026 CableConnect
        </div>

    </main>

</body>

</html>

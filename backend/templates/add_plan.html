<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Plan - CableConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .save-button {
            flex: 1;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px;
            border-radius: 7px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-button:hover {
            background: #1d4ed8;
        }

        .cancel-button {
            flex: 1;
            text-align: center;
            text-decoration: none;
            background: #e5e7eb;
            color: #374151;
            padding: 13px;
            border-radius: 7px;
            font-weight: 600;
        }

        .cancel-button:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Add TV Plan</h1>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label for="plan_name">Plan Name</label>

                <input
                    type="text"
                    id="plan_name"
                    name="plan_name"
                    placeholder="Example: Basic TV"
                    required
                >
            </div>


            <div class="form-group">
                <label for="service_type">Service Type</label>

                <select
                    id="service_type"
                    name="service_type"
                    required
                >
                    <option value="">Select Service</option>
                    <option value="TV">TV</option>
                    <option value="Wi-Fi">Wi-Fi</option>
                </select>
            </div>


            <div class="form-group">
                <label for="monthly_amount">Monthly Amount</label>

                <input
                    type="number"
                    id="monthly_amount"
                    name="monthly_amount"
                    placeholder="Example: 250"
                    min="0"
                    step="0.01"
                    required
                >
            </div>


            <div class="form-group">
                <label for="description">Description</label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Enter plan description"
                ></textarea>
            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="save-button"
                >
                    Save Plan
                </button>

                <a
                    href="{{ url_for('plans') }}"
                    class="cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>

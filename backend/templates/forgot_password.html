<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - CableConnect</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #24104f,
                    #4b217f,
                    #1b0b3a
                );

        }

        .container {

            width: 400px;

            padding: 40px;

            background: rgba(255, 255, 255, 0.12);

            border-radius: 20px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.4);

            text-align: center;

            color: white;

        }

        .logo {

            font-size: 30px;

            font-weight: bold;

            margin-bottom: 10px;

        }

        .subtitle {

            font-size: 14px;

            color: #ddd;

            margin-bottom: 30px;

        }

        h2 {

            margin-bottom: 20px;

        }

        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 20px;

            border: none;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #ffffff;

            color: #3b1768;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        button:hover {

            background: #eeeeee;

        }

        .message {

            margin-bottom: 15px;

            padding: 10px;

            border-radius: 6px;

            background: rgba(0, 255, 150, 0.15);

            color: #b8ffd9;

            font-size: 14px;

        }

        .error {

            margin-bottom: 15px;

            padding: 10px;

            border-radius: 6px;

            background: rgba(255, 0, 0, 0.15);

            color: #ffbaba;

            font-size: 14px;

        }

        .back {

            display: block;

            margin-top: 20px;

            color: white;

            text-decoration: none;

            font-size: 14px;

        }

        .back:hover {

            text-decoration: underline;

        }

    </style>

</head>


<body>

    <div class="container">

        <div class="logo">
            CableConnect
        </div>

        <div class="subtitle">
            TV & Internet Management System
        </div>

        <h2>
            Forgot Password?
        </h2>

        <p class="subtitle">
            Enter your registered email address.
            We will send you a password reset link.
        </p>


        {% if success_message %}

            <div class="message">
                {{ success_message }}
            </div>

        {% endif %}


        {% if error_message %}

            <div class="error">
                {{ error_message }}
            </div>

        {% endif %}


        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

            <button type="submit">
                SEND RESET LINK
            </button>

        </form>


        <a
            href="{{ url_for('login') }}"
            class="back"
        >
            ← Back to Login
        </a>

    </div>

</body>

</html>

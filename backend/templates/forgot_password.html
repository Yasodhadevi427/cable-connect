<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - CableConnect</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        /* =========================================
           Body
           ========================================= */

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #dbeafe,
                    #f8fafc
                );

            color: #1e293b;

            padding: 20px;

            overflow: hidden;
        }


        /* =========================================
           Background Decoration
           ========================================= */

        body::before {

            content: "";

            position: fixed;

            width: 500px;

            height: 500px;

            border-radius: 50%;

            background:
                rgba(37, 99, 235, 0.08);

            top: -180px;

            left: -180px;

            z-index: 0;
        }


        body::after {

            content: "";

            position: fixed;

            width: 600px;

            height: 600px;

            border-radius: 50%;

            background:
                rgba(59, 130, 246, 0.07);

            bottom: -250px;

            right: -200px;

            z-index: 0;
        }


        /* =========================================
           Container
           ========================================= */

        .container {

            position: relative;

            z-index: 1;

            width: 400px;

            padding: 40px;

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 16px;

            box-shadow:
                0 20px 50px
                rgba(15, 23, 42, 0.15);

            text-align: center;

            color: #1e293b;
        }


        /* =========================================
           Logo
           ========================================= */

        .logo {

            font-size: 30px;

            font-weight: bold;

            margin-bottom: 10px;

            color: #1e293b;
        }


        .logo span {

            color: #2563eb;
        }


        /* =========================================
           Subtitle
           ========================================= */

        .subtitle {

            font-size: 14px;

            color: #64748b;

            margin-bottom: 30px;

            line-height: 1.6;
        }


        /* =========================================
           Heading
           ========================================= */

        h2 {

            margin-bottom: 20px;

            color: #1e293b;
        }


        /* =========================================
           Input
           ========================================= */

        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 20px;

            border:
                1px solid #e2e8f0;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

            color: #1e293b;

            background: #f8fafc;

            transition: 0.3s;
        }


        input::placeholder {

            color: #94a3b8;
        }


        input:focus {

            border-color: #2563eb;

            background: #ffffff;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }


        /* =========================================
           Button
           ========================================= */

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: #ffffff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 5px 15px
                rgba(37, 99, 235, 0.20);
        }


        button:hover {

            background: #1d4ed8;

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(37, 99, 235, 0.30);
        }


        button:active {

            transform:
                translateY(0);
        }


        /* =========================================
           Success Message
           ========================================= */

        .message {

            margin-bottom: 15px;

            padding: 10px;

            border-radius: 8px;

            background: #f0fdf4;

            border:
                1px solid #bbf7d0;

            color: #15803d;

            font-size: 14px;

            line-height: 1.5;
        }


        /* =========================================
           Error Message
           ========================================= */

        .error {

            margin-bottom: 15px;

            padding: 10px;

            border-radius: 8px;

            background: #fef2f2;

            border:
                1px solid #fecaca;

            color: #b91c1c;

            font-size: 14px;

            line-height: 1.5;
        }


        /* =========================================
           Back To Login
           ========================================= */

        .back {

            display: block;

            margin-top: 20px;

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            transition: 0.2s;
        }


        .back:hover {

            color: #1d4ed8;

            text-decoration: underline;
        }


        /* =========================================
           Mobile
           ========================================= */

        @media (max-width: 500px) {

            .container {

                width:
                    calc(100% - 10px);

                padding:
                    30px 25px;
            }


            .logo {

                font-size: 26px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- Logo -->

        <div class="logo">

            Cable<span>Connect</span>

        </div>


        <!-- Subtitle -->

        <div class="subtitle">

            TV & Internet Management System

        </div>


        <!-- Heading -->

        <h2>

            Forgot Password?

        </h2>


        <p class="subtitle">

            Enter your registered email address.
            We will send you a password reset link.

        </p>


        <!-- Success Message -->

        {% if success_message %}

            <div class="message">

                {{ success_message }}

            </div>

        {% endif %}


        <!-- Error Message -->

        {% if error_message %}

            <div class="error">

                {{ error_message }}

            </div>

        {% endif %}


        <!-- Forgot Password Form -->

        <form method="POST">


            <!-- CSRF Security Token -->

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >


            <!-- Email -->

            <input
                type="email"
                name="email"
                placeholder="Enter your registered email"
                required
                autocomplete="email"
            >


            <!-- Send Reset Link -->

            <button type="submit">

                SEND RESET LINK

            </button>


        </form>


        <!-- Back To Login -->

        <a
            href="{{ url_for('login') }}"
            class="back"
        >

            ← Back to Login

        </a>


    </div>


</body>

</html>

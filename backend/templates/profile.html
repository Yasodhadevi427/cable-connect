<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CableConnect - Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;

            color: #1f2937;
        }


        /* =========================================
           Profile Container
           ========================================= */

        .profile-container {

            width: 450px;

            padding: 40px;

            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 16px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.10);
        }


        /* =========================================
           Profile Icon
           ========================================= */

        .profile-icon {

            width: 90px;

            height: 90px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #e8f1ff;

            color: #2563eb;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 42px;

            border: 3px solid #dbeafe;
        }


        /* =========================================
           Heading
           ========================================= */

        h1 {

            text-align: center;

            margin-bottom: 30px;

            font-size: 28px;

            color: #1e293b;

            letter-spacing: 0.3px;
        }


        /* =========================================
           Profile Item
           ========================================= */

        .profile-item {

            margin-bottom: 20px;
        }


        .profile-item label {

            display: block;

            color: #64748b;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        .profile-value {

            width: 100%;

            min-height: 48px;

            display: flex;

            align-items: center;

            background: #f8fafc;

            color: #1e293b;

            padding: 14px;

            border: 1px solid #e2e8f0;

            border-radius: 8px;

            font-size: 16px;

            word-break: break-word;
        }


        /* =========================================
           Edit Profile Button
           ========================================= */

        .edit-button {

            display: block;

            width: 100%;

            text-align: center;

            margin-top: 10px;

            padding: 14px;

            background: #eff6ff;

            color: #2563eb;

            border: 1px solid #2563eb;

            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;

            letter-spacing: 0.3px;

            transition: 0.3s;
        }


        .edit-button:hover {

            background: #dbeafe;

            transform: translateY(-1px);

            box-shadow:
                0 5px 15px
                rgba(37, 99, 235, 0.12);
        }


        /* =========================================
           Back Button
           ========================================= */

        .back-button {

            display: block;

            width: 100%;

            text-align: center;

            margin-top: 12px;

            padding: 14px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;

            letter-spacing: 0.3px;

            transition: 0.3s;
        }


        .back-button:hover {

            background: #1d4ed8;

            transform: translateY(-1px);

            box-shadow:
                0 5px 15px
                rgba(37, 99, 235, 0.25);
        }


        /* =========================================
           Mobile
           ========================================= */

        @media (max-width: 500px) {

            .profile-container {

                width: calc(100% - 30px);

                padding: 30px 25px;
            }


            h1 {

                font-size: 24px;
            }


            .profile-icon {

                width: 80px;

                height: 80px;

                font-size: 36px;
            }

        }

    </style>

</head>


<body>


    <div class="profile-container">


        <!-- Profile Icon -->

        <div class="profile-icon">

            👤

        </div>


        <!-- Heading -->

        <h1>

            Operator Profile

        </h1>


        <!-- Name -->

        <div class="profile-item">

            <label>

                Name

            </label>

            <div class="profile-value">

                {{ operator["name"] }}

            </div>

        </div>


        <!-- Username -->

        <div class="profile-item">

            <label>

                Username

            </label>

            <div class="profile-value">

                {{ operator["username"] }}

            </div>

        </div>


        <!-- Email -->

        <div class="profile-item">

            <label>

                Email

            </label>

            <div class="profile-value">

                {{ operator["email"] }}

            </div>

        </div>


        <!-- Edit Profile -->

        <a
            href="{{ url_for('edit_profile') }}"
            class="edit-button"
        >

            ✏️ EDIT PROFILE

        </a>


        <!-- Back To Dashboard -->

        <a
            href="{{ url_for('dashboard') }}"
            class="back-button"
        >

            ← BACK TO DASHBOARD

        </a>


    </div>


</body>

</html>

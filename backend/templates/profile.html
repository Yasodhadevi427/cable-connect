<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CableConnect - Profile</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #21152f,
                    #4b365f,
                    #21152f
                );

            color: white;
        }


        /* =========================================
           Profile Container
           ========================================= */

        .profile-container {

            width: 450px;

            padding: 40px;

            background:
                rgba(255,255,255,0.10);

            border:
                1px solid
                rgba(255,255,255,0.15);

            border-radius: 10px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.45);

            backdrop-filter: blur(8px);
        }


        /* =========================================
           Profile Icon
           ========================================= */

        .profile-icon {

            width: 90px;

            height: 90px;

            margin:
                0 auto 20px;

            border-radius: 50%;

            background: #09070d;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 42px;
        }


        /* =========================================
           Heading
           ========================================= */

        h1 {

            text-align: center;

            margin-bottom: 30px;

            font-size: 28px;

            letter-spacing: 0.5px;
        }


        /* =========================================
           Profile Item
           ========================================= */

        .profile-item {

            margin-bottom: 20px;
        }


        .profile-item label {

            display: block;

            color: #cfc4d8;

            font-size: 14px;

            margin-bottom: 7px;
        }


        .profile-value {

            width: 100%;

            min-height: 48px;

            display: flex;

            align-items: center;

            background: white;

            color: #333;

            padding: 14px;

            border-radius: 4px;

            font-size: 16px;

            word-break: break-word;
        }


        /* =========================================
           Back Button
           ========================================= */

        .back-button {

            display: block;

            width: 100%;

            text-align: center;

            margin-top: 25px;

            padding: 14px;

            background: #171021;

            color: white;

            text-decoration: none;

            border-radius: 4px;

            font-weight: bold;

            letter-spacing: 0.5px;

            transition: 0.3s;
        }


        .back-button:hover {

            background: #0d0913;

            transform: translateY(-1px);

            box-shadow:
                0 5px 15px
                rgba(0,0,0,0.35);
        }


        /* =========================================
           Mobile
           ========================================= */

        @media (max-width: 500px) {

            .profile-container {

                width:
                    calc(100% - 30px);

                padding: 30px 25px;
            }


            h1 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="profile-container">


        <!-- Profile Icon -->

        <div class="profile-icon">

            👤

        </div>


        <!-- Heading -->

        <h1>

            Operator Profile

        </h1>


        <!-- Name -->

        <div class="profile-item">

            <label>

                Name

            </label>


            <div class="profile-value">

                {{ operator["name"] }}

            </div>

        </div>


        <!-- Username -->

        <div class="profile-item">

            <label>

                Username

            </label>


            <div class="profile-value">

                {{ operator["username"] }}

            </div>

        </div>


        <!-- Email -->

        <div class="profile-item">

            <label>

                Email

            </label>


            <div class="profile-value">

                {{ operator["email"] }}

            </div>

        </div>


        <!-- Back To Dashboard -->

        <a
            href="{{ url_for('dashboard') }}"
            class="back-button"
        >

            ← BACK TO DASHBOARD

        </a>


    </div>


</body>

</html>
